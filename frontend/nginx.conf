server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Reverse proxy: API calls → backend container ──
    location /api/ {
        proxy_pass         http://api:5163/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 25M;
    }

    # ── Reverse proxy: uploaded files → backend static files ──
    location /uploads/ {
        proxy_pass         http://api:5163/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Reverse proxy: Google OAuth callback ──
    location /signin-google {
        proxy_pass         http://api:5163/signin-google;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── SPA fallback: serve index.html for all Angular routes ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache static assets ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
